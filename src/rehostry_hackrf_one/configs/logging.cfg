#
# hal_log.py loads logging.cfg from the process CWD if one exists, else the
# packaged default -- whose `[loggers] keys=` line lists only root, main and
# HAL_LOG. Anything a CORE module logs at INFO therefore vanishes, including
# the `HAL_PC_SAMPLE` histogram and the `inject_irq(N): vector table slot is
# zero` warning, which fires exactly when an interrupt is being misdirected
# (playbook traps 2.42 / 2.68 / 2.111).
#
# spawn_cwd() is this configs dir, so this file is the one that gets loaded.
# The backend logger is named, at INFO -- NOT DEBUG, which would emit a record
# per instruction.
[loggers]
keys=root,halucinator.main,HAL_LOG,halucinator.backends.unicorn_backend

[handlers]
keys=consoleHandler

[formatters]
keys=sampleFormatter

[logger_root]
level=WARNING
handlers=consoleHandler

[logger_halucinator.main]
level=INFO
handlers=consoleHandler
propagate=0
qualname=halucinator.main

[logger_HAL_LOG]
level=INFO
handlers=consoleHandler
propagate=0
qualname=HAL_LOG

[logger_halucinator.backends.unicorn_backend]
level=INFO
handlers=consoleHandler
propagate=0
qualname=halucinator.backends.unicorn_backend

[handler_consoleHandler]
class=StreamHandler
level=DEBUG
formatter=sampleFormatter
args=(sys.stdout,)

[formatter_sampleFormatter]
format=%(name)s|%(levelname)s|  %(message)s
